{% extends 'forum/base.html' %}
{% block content %}
<div style="max-width:400px;margin:80px auto;padding:30px;background:white;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
  <h2 style="margin-bottom:20px;text-align:center;">Sign in</h2>
  {% if form.errors %}
    <p style="color:#c0392b;margin-bottom:10px;">Invalid username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Username" required
           style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;">
    <input type="password" name="password" placeholder="Password" required
           style="width:100%;padding:10px;margin-bottom:15px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;">
    <button type="submit" style="width:100%;background:#2c3e50;color:white;border:none;padding:12px;border-radius:6px;cursor:pointer;">
      Log In
    </button>
  </form>
</div>
{% endblock %}
