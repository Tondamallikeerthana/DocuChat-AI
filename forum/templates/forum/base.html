<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuChat AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; font-size: 20px; font-weight: bold; }
        .navbar a { color: white; text-decoration: none; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">DocuChat AI</a>
        {% if user.is_authenticated %}
            <a href="{% url 'logout' %}" style="float:right; font-size:14px;">Logout ({{ user.username }})</a>
        {% endif %}
    </div>

    {% block content %}
    {% endblock %}

</body>
</html>
